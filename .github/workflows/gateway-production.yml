name: Cloudflare Gateway Production Release

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the validated Worker version to production traffic"
        required: true
        type: boolean
        default: false
      enable_workers_ai:
        description: "Enable Workers AI binding and run one grounded smoke request (may consume usage quota)"
        required: true
        type: boolean
        default: false
      enable_support_retention:
        description: "Enable automatic deletion of inactive support tickets after the selected retention period"
        required: true
        type: boolean
        default: false
      allow_feature_removal:
        description: "Allow removal of currently active Workers AI or support-retention configuration; requires explicit owner approval"
        required: true
        type: boolean
        default: false
      retention_days:
        description: "Support ticket inactivity retention period (used only when enabled)"
        required: true
        type: choice
        options:
          - "30"
          - "60"
          - "90"
          - "180"
        default: "90"

permissions:
  contents: read

concurrency:
  group: gateway-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and optionally deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate Worker source and release policy
        run: |
          set -euo pipefail
          node --check cloudflare/gateway/src/index.js
          node --test cloudflare/gateway/tests/*.test.mjs scripts/deploy-production-worker.test.mjs
          ruby scripts/validate-openapi.rb
          python scripts/test-d1-migrations.py
      - name: Require main as the production deployment source
        if: ${{ inputs.deploy }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Production deployment must be dispatched from refs/heads/main."
            exit 1
          fi
      - name: Validate production bindings and optionally release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ae50292f7e60c0d6d0052727e61c4033
          CLOUDFLARE_D1_DATABASE_ID: 87c15170-7995-4929-b00c-20b5b491c05f
          DEPLOY_WORKER: ${{ inputs.deploy }}
          ENABLE_WORKERS_AI: ${{ inputs.enable_workers_ai }}
          ENABLE_SUPPORT_RETENTION: ${{ inputs.enable_support_retention }}
          ALLOW_FEATURE_REMOVAL: ${{ inputs.allow_feature_removal }}
          SUPPORT_RETENTION_DAYS: ${{ inputs.retention_days }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/deploy-production-worker.mjs
