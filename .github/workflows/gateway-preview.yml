name: Cloudflare Gateway Preview Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-preview-release
  cancel-in-progress: false

jobs:
  preview:
    name: Deploy isolated preview Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: gateway-preview
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate preview configuration
        env:
          PREVIEW_D1_DATABASE_ID: a764f930-430f-4898-a0b6-b57f5caf9c78
          CF_ACCOUNT_ID: ae50292f7e60c0d6d0052727e61c4033
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_D1_DATABASE_ID" || { echo "Missing gateway-preview variable PREVIEW_D1_DATABASE_ID"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "Missing gateway-preview variable CF_ACCOUNT_ID"; exit 1; }
          test -n "$CF_API_TOKEN" || { echo "Missing gateway-preview secret CF_API_TOKEN"; exit 1; }
          node -e 'if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(process.argv[1]))process.exit(1)' "$PREVIEW_D1_DATABASE_ID"
      - name: Build isolated Wrangler configuration
        env:
          PREVIEW_D1_DATABASE_ID: a764f930-430f-4898-a0b6-b57f5caf9c78
          CF_ACCOUNT_ID: ae50292f7e60c0d6d0052727e61c4033
          GITHUB_WORKSPACE: ${{ github.workspace }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { resolve } from "node:path";
          const root = process.env.GITHUB_WORKSPACE;
          const config = {
            name: "mr-siavash-ai-gateway-preview",
            account_id: process.env.CF_ACCOUNT_ID,
            main: resolve(root, "cloudflare/gateway/src/index.js"),
            compatibility_date: "2026-11-08",
            workers_dev: true,
            observability: { enabled: true },
            d1_databases: [{
              binding: "DB",
              database_name: "mr-siavash-ai-preview",
              database_id: process.env.PREVIEW_D1_DATABASE_ID,
              migrations_dir: resolve(root, "cloudflare/gateway/migrations")
            }],
            vars: { ALLOWED_ORIGINS: "https://mrsiavasshirbot.github.io", SUPPORT_RETENTION_DAYS: "90" },
            triggers: { crons: ["0 3 * * *"] }
          };
          writeFileSync(resolve(process.env.RUNNER_TEMP, "wrangler-preview.json"), JSON.stringify(config, null, 2));
          NODE
      - name: Apply migrations to preview database only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ae50292f7e60c0d6d0052727e61c4033
        run: npx --yes wrangler@4.45.0 d1 migrations apply mr-siavash-ai-preview --remote --config "$RUNNER_TEMP/wrangler-preview.json"
      - name: Deploy preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ae50292f7e60c0d6d0052727e61c4033
        run: npx --yes wrangler@4.45.0 deploy --config "$RUNNER_TEMP/wrangler-preview.json"
      - name: Verify deployed preview routes
        env:
          BASE_URL: https://mr-siavash-ai-gateway-preview.mrsiavashirbot.workers.dev
          ALLOWED_ORIGIN: https://mrsiavasshirbot.github.io
        run: |
          set -euo pipefail
          live="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 15 "$BASE_URL/v1/health/live")"
          node -e 'const x=JSON.parse(process.argv[1]);if(x.status!=="ok"||x.service!=="mr-siavash-ai-gateway")process.exit(1)' "$live"
          ready="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 15 "$BASE_URL/v1/health/ready")"
          node -e 'const x=JSON.parse(process.argv[1]);if(x.status!=="ready"||x.dependencies?.database!=="ready")process.exit(1)' "$ready"
          modules="$(curl --fail --silent --show-error --max-time 15 "$BASE_URL/v1/modules")"
          node -e 'const x=JSON.parse(process.argv[1]);if(!Array.isArray(x.items)||x.items.length<1)process.exit(1)' "$modules"
          status="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' --request OPTIONS "$BASE_URL/v1/modules" --header "Origin: $ALLOWED_ORIGIN" --header "Access-Control-Request-Method: GET" --header "Access-Control-Request-Headers: content-type")"
          test "$status" = "204"
