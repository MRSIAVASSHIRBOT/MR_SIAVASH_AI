name: Quality checks and GitHub Pages deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feature/python-academy-beginner-course-2026-11-08
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Syntax and structure checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install pinned Playwright
        run: npm install --global playwright@1.56.1
      - name: Install Chromium and system dependencies
        run: playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check site-search.js
          node --check ui-sounds.js
          node --check sw.js
          node --check bounded-json.js
          node --check support.js
          node --check support-tickets.mjs
          node --check support-admin.js
          node --check python-course.js
          node --check academy.js
          node --check studio-portfolio.js
          node --check cloudflare/gateway/src/index.js
          node --check scripts/deploy-production-worker.mjs
          node --check scripts/generate-hub-public-status.mjs
      - name: Validate OpenAPI design contract
        run: ruby scripts/validate-openapi.rb
      - name: Run repository tests
        run: node --test tests/*.test.mjs cloudflare/gateway/tests/*.test.mjs scripts/*.test.mjs
      - name: Validate D1 migrations in isolated SQLite
        run: python3 scripts/test-d1-migrations.py
      - name: Run Academy Chromium end-to-end acceptance
        run: |
          export NODE_PATH="$(npm root -g)"
          node scripts/academy-browser-e2e.cjs

  deploy:
    name: Deploy static site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Generate public Hub repository status snapshot
        run: node scripts/generate-hub-public-status.mjs
      - name: Upload static website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
