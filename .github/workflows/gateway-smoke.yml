name: Cloudflare Gateway Runtime Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify deployed gateway health and CORS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify liveness and readiness endpoints
        env:
          GATEWAY_BASE_URL: https://mr-siavash-ai-gateway.mrsiavashirbot.workers.dev
          ALLOWED_ORIGIN: https://mrsiavasshirbot.github.io
        shell: bash
        run: |
          set -euo pipefail

          live="$(curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 --max-time 15 "$GATEWAY_BASE_URL/v1/health/live")"
          node -e 'const body=JSON.parse(process.argv[1]); if(body.status!=="ok" || body.service!=="mr-siavash-ai-gateway" || typeof body.request_id!=="string") process.exit(1);' "$live"

          ready="$(curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 --max-time 15 "$GATEWAY_BASE_URL/v1/health/ready")"
          node -e 'const body=JSON.parse(process.argv[1]); if(body.status!=="ready" || body.dependencies?.database!=="ready" || typeof body.request_id!=="string") process.exit(1);' "$ready"

      - name: Verify deployed public support API without creating records
        env:
          GATEWAY_BASE_URL: https://mr-siavash-ai-gateway.mrsiavashirbot.workers.dev
        shell: bash
        run: |
          set -euo pipefail

          unknown_status="$(curl --silent --show-error --max-time 15 --output /tmp/ticket.json --write-out '%{http_code}' "$GATEWAY_BASE_URL/v1/support/tickets/MS-0000000000000000")"
          test "$unknown_status" = "404"
          node -e 'const x=JSON.parse(require("node:fs").readFileSync("/tmp/ticket.json","utf8"));if(x.error?.code!=="ticket_not_found")process.exit(1)'

          ready_body="$(curl --fail --silent --show-error --max-time 15 "$GATEWAY_BASE_URL/v1/health/ready")"
          public_support="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(typeof x.features?.publicSupport==="boolean"?String(x.features.publicSupport):"legacy")' "$ready_body")"
          invalid_status="$(curl --silent --show-error --max-time 15 --output /tmp/invalid-ticket.json --write-out '%{http_code}' --request POST "$GATEWAY_BASE_URL/v1/support/tickets" --header 'Content-Type: application/json' --data '{"subject":"","message":""}')"
          if [ "$public_support" = "false" ]; then
            test "$invalid_status" = "503"
            node -e 'const x=JSON.parse(require("node:fs").readFileSync("/tmp/invalid-ticket.json","utf8"));if(x.error?.code!=="support_retention_required")process.exit(1)'
          else
            # Older deployed versions have no explicit feature flag and still validate the request body.
            test "$invalid_status" = "400"
            node -e 'const x=JSON.parse(require("node:fs").readFileSync("/tmp/invalid-ticket.json","utf8"));if(x.error?.code!=="invalid_ticket")process.exit(1)'
          fi

      - name: Verify exact-origin CORS preflight
        env:
          GATEWAY_BASE_URL: https://mr-siavash-ai-gateway.mrsiavashirbot.workers.dev
          ALLOWED_ORIGIN: https://mrsiavasshirbot.github.io
        shell: bash
        run: |
          set -euo pipefail

          headers="$(curl --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 --max-time 15 --dump-header - --output /dev/null \
            --request OPTIONS "$GATEWAY_BASE_URL/v1/health/live" \
            --header "Origin: $ALLOWED_ORIGIN" \
            --header "Access-Control-Request-Method: GET" \
            --header "Access-Control-Request-Headers: content-type,x-request-id")"

          grep -Eiq '^HTTP/[^ ]+ 204([[:space:]]|$)' <<< "$headers"
          grep -Fqi "access-control-allow-origin: $ALLOWED_ORIGIN" <<< "$headers"
          grep -Eiq '^access-control-allow-methods:.*GET' <<< "$headers"

      - name: Verify untrusted origins receive no CORS grant
        env:
          GATEWAY_BASE_URL: https://mr-siavash-ai-gateway.mrsiavashirbot.workers.dev
        shell: bash
        run: |
          set -euo pipefail

          headers_file="$(mktemp)"
          body_file="$(mktemp)"
          trap 'rm -f "$headers_file" "$body_file"' EXIT
          status="$(curl --silent --show-error --max-time 15 --dump-header "$headers_file" --output "$body_file" --write-out '%{http_code}' \
            --request OPTIONS "$GATEWAY_BASE_URL/v1/health/live" \
            --header "Origin: https://untrusted.invalid" \
            --header "Access-Control-Request-Method: GET")"

          case "$status" in
            204|403) ;;
            *) echo "Unexpected untrusted preflight status: $status" >&2; exit 1 ;;
          esac
          if grep -Eiq '^access-control-allow-origin:' "$headers_file"; then
            echo "Gateway granted CORS access to an untrusted origin." >&2
            exit 1
          fi
