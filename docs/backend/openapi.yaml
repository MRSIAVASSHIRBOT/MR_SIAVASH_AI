openapi: 3.1.0
info:
  title: MR_SIAVASH_AI Platform API
  version: 0.1.0
  summary: Proposed contract for the future MR_SIAVASH_AI backend.
  description: |
    API design contract and partial route contract. The production Worker serves health,
    knowledge-fallback assistant, support ticket, and administrator routes; the isolated
    preview runs current source. This document is not a complete inventory of deployed
    routes. Verify environment status in cloudflare/gateway/README.md.
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder only; replace after a real backend is provisioned.
tags:
  - name: System
  - name: Modules
  - name: Workspace
  - name: Support
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Minimal service health check
      security: []
      responses:
        "200":
          description: Service is responding without infrastructure details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /modules:
    get:
      tags: [Modules]
      operationId: listModules
      summary: List public module metadata
      security: []
      parameters:
        - in: query
          name: category
          schema:
            type: string
            maxLength: 40
        - in: query
          name: cursor
          schema:
            type: string
            maxLength: 512
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Public module metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
  /me/tasks:
    get:
      tags: [Workspace]
      operationId: listMyTasks
      summary: List tasks belonging to the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
            maxLength: 512
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Tasks visible to the authenticated principal only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCollection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [Workspace]
      operationId: createMyTask
      summary: Create a task for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Task created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Idempotency key was reused with a different request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /me/tasks/{taskId}:
    parameters:
      - in: path
        name: taskId
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Workspace]
      operationId: updateMyTask
      summary: Update a task owned by the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Workspace]
      operationId: deleteMyTask
      summary: Delete a task owned by the authenticated user
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Task deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /support/tickets:
    post:
      tags: [Support]
      operationId: createSupportTicket
      summary: Create a support ticket with explicit privacy acknowledgement
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportTicketRequest"
      responses:
        "201":
          description: Ticket created; the private bearer token is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSupportTicketResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /support/tickets/{code}:
    parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
          pattern: "^MS-[A-F0-9]{16}$"
    get:
      tags: [Support]
      operationId: getMySupportTicket
      summary: Read a ticket using its private one-time bearer credential
      security:
        - ticketToken: []
      responses:
        "200":
          description: Ticket and conversation visible to the bearer-token holder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketThread"
        "404":
          $ref: "#/components/responses/NotFound"
  /support/tickets/{code}/messages:
    parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
          pattern: "^MS-[A-F0-9]{16}$"
    post:
      tags: [Support]
      operationId: replyToMySupportTicket
      summary: Add a user reply using the ticket's private bearer credential
      security:
        - ticketToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportReply"
      responses:
        "201":
          description: Reply accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Placeholder user-session scheme. Validate signature, issuer, audience, expiry,
        not-before, and key rotation server-side. Never trust client-supplied user IDs.
    ticketToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Ticket-specific random secret returned once at creation. Store only its hash;
        send it in the Authorization header and never in a URL or browser storage.
  schemas:
    CreateSupportTicketRequest:
      type: object
      additionalProperties: false
      required: [category, subject, message, consent]
      properties:
        category:
          type: string
          enum: [question, suggestion, complaint, bug, other]
        subject:
          type: string
          minLength: 1
          maxLength: 120
        message:
          type: string
          minLength: 1
          maxLength: 4000
        contact_email:
          type: [string, "null"]
          format: email
          maxLength: 254
        website:
          type: string
          maxLength: 200
          description: Honeypot field; must remain empty.
        consent:
          type: boolean
          const: true
          description: Required acknowledgement of the published support privacy and retention notice.
    CreateSupportTicketResponse:
      type: object
      required: [ticket, notice, request_id]
      properties:
        ticket:
          type: object
          required: [id, code, token, status, retention_days]
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
              pattern: "^MS-[A-F0-9]{16}$"
            token:
              type: string
              pattern: "^[a-f0-9]{64}$"
            status:
              type: string
              const: open
            retention_days:
              type: integer
              minimum: 30
              maximum: 365
        notice:
          type: string
        request_id:
          type: string
    SupportReply:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
    SupportTicket:
      type: object
      required: [id, code, category, subject, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^MS-[A-F0-9]{16}$"
        category:
          type: string
          enum: [question, suggestion, complaint, bug, other]
        subject:
          type: string
          maxLength: 120
        status:
          type: string
          enum: [open, in_progress, waiting_user, resolved]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SupportMessage:
      type: object
      required: [sender_role, body, created_at]
      properties:
        sender_role:
          type: string
          enum: [user, assistant, admin]
        body:
          type: string
          maxLength: 4000
        created_at:
          type: string
          format: date-time
    SupportTicketThread:
      type: object
      required: [ticket, messages]
      properties:
        ticket:
          $ref: "#/components/schemas/SupportTicket"
        messages:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/SupportMessage"
    Health:
      type: object
      additionalProperties: false
      required: [status, apiVersion]
      properties:
        status:
          type: string
          enum: [ok]
        apiVersion:
          type: string
          const: "v1"
    Module:
      type: object
      additionalProperties: false
      required: [id, title, category, availability]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9-]{2,64}$"
        title:
          type: string
          minLength: 1
          maxLength: 80
        category:
          type: string
          minLength: 1
          maxLength: 40
        availability:
          type: string
          enum: [available, preview, planned]
        summary:
          type: string
          maxLength: 280
    ModuleCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/Module"
        nextCursor:
          type: [string, "null"]
          maxLength: 512
    Task:
      type: object
      additionalProperties: false
      required: [id, text, done, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 120
        done:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaskCreate:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 120
    TaskUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 120
        done:
          type: boolean
    TaskCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Task"
        nextCursor:
          type: [string, "null"]
          maxLength: 512
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          maxLength: 120
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 500
        code:
          type: string
          pattern: "^[a-z0-9_]{2,64}$"
        requestId:
          type: string
          maxLength: 80
  responses:
    BadRequest:
      description: Request failed schema or semantic validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Authentication is missing, invalid, or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource does not exist or is not visible to this principal.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Request limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
