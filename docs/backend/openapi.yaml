openapi: 3.1.0
info:
  title: MR_SIAVASH_AI Platform API
  version: 0.1.0
  summary: Proposed contract for the future MR_SIAVASH_AI backend.
  description: |
    DESIGN CONTRACT ONLY. No API server is currently deployed by this repository.
    Implementations must pass authentication, authorization, validation, isolation,
    rate-limit, audit, and integration tests before any endpoint is exposed.
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder only; replace after a real backend is provisioned.
tags:
  - name: System
  - name: Modules
  - name: Workspace
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Minimal service health check
      security: []
      responses:
        "200":
          description: Service is responding without infrastructure details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /modules:
    get:
      tags: [Modules]
      operationId: listModules
      summary: List public module metadata
      security: []
      parameters:
        - in: query
          name: category
          schema:
            type: string
            maxLength: 40
        - in: query
          name: cursor
          schema:
            type: string
            maxLength: 512
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Public module metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
  /me/tasks:
    get:
      tags: [Workspace]
      operationId: listMyTasks
      summary: List tasks belonging to the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
            maxLength: 512
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Tasks visible to the authenticated principal only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCollection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [Workspace]
      operationId: createMyTask
      summary: Create a task for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Task created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Idempotency key was reused with a different request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /me/tasks/{taskId}:
    parameters:
      - in: path
        name: taskId
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Workspace]
      operationId: updateMyTask
      summary: Update a task owned by the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Workspace]
      operationId: deleteMyTask
      summary: Delete a task owned by the authenticated user
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Task deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Placeholder auth scheme. Validate signature, issuer, audience, expiry,
        not-before, and key rotation server-side. Never trust client-supplied user IDs.
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, apiVersion]
      properties:
        status:
          type: string
          enum: [ok]
        apiVersion:
          type: string
          const: "v1"
    Module:
      type: object
      additionalProperties: false
      required: [id, title, category, availability]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9-]{2,64}$"
        title:
          type: string
          minLength: 1
          maxLength: 80
        category:
          type: string
          minLength: 1
          maxLength: 40
        availability:
          type: string
          enum: [available, preview, planned]
        summary:
          type: string
          maxLength: 280
    ModuleCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/Module"
        nextCursor:
          type: [string, "null"]
          maxLength: 512
    Task:
      type: object
      additionalProperties: false
      required: [id, text, done, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 120
        done:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaskCreate:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 120
    TaskUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 120
        done:
          type: boolean
    TaskCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Task"
        nextCursor:
          type: [string, "null"]
          maxLength: 512
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          maxLength: 120
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 500
        code:
          type: string
          pattern: "^[A-Z0-9_]{2,64}$"
        requestId:
          type: string
          maxLength: 80
  responses:
    BadRequest:
      description: Request failed schema or semantic validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Authentication is missing, invalid, or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource does not exist or is not visible to this principal.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Request limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
